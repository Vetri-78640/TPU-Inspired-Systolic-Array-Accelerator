name: tests

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Icarus Verilog and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install numpy matplotlib

      - name: Unit and accelerator tests
        run: |
          make test | tee test.log
          if grep -q FAIL test.log; then exit 1; fi
          test "$(grep -c PASSED test.log)" -eq 5

      - name: Sequential baseline and timing model
        run: |
          make seq | tee seq.log
          if grep -q FAIL seq.log; then exit 1; fi
          grep -q "ALL 106 MATRIX TESTS PASSED" seq.log
          make model
