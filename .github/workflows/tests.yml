name: tests

on:
  push:
  pull_request:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Icarus Verilog and Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          pip install numpy matplotlib scikit-learn

      - name: Test suites
        run: |
          make test | tee test.log
          if grep -q FAIL test.log; then exit 1; fi
          test "$(grep -c PASSED test.log)" -eq "$(sed -n 's/^test://p' Makefile | wc -w)"

      - name: Test suites with the pipelined MAC
        run: |
          make test PIPE=1 | tee pipe.log
          if grep -q FAIL pipe.log; then exit 1; fi
          test "$(grep -c PASSED pipe.log)" -eq "$(sed -n 's/^test://p' Makefile | wc -w)"

      - name: Sequential baseline and timing model
        run: |
          make seq | tee seq.log
          if grep -q FAIL seq.log; then exit 1; fi
          grep -q "ALL 106 MATRIX TESTS PASSED" seq.log
          make model

      - name: Neural network demo on the accelerator
        run: |
          make nn | tee nn.log
          grep -q "NN DEMO PASSED" nn.log
